name: release

# Trusted publishing (OIDC): no npm or PyPI tokens exist anywhere. npmjs.com and pypi.org trust exactly this
# repository + this workflow file + the `release` environment.
#
#   git tag node-v0.1.1   && git push origin node-v0.1.1     -> npm    (version must equal node/package.json)
#   git tag python-v0.1.0 && git push origin python-v0.1.0   -> PyPI   (version must equal python/pyproject.toml)
on:
  push:
    tags: ['node-v*', 'python-v*']

permissions:
  contents: read

jobs:
  npm:
    if: startsWith(github.ref_name, 'node-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write   # OIDC token for npm trusted publishing (also signs the provenance statement)
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - name: Tag matches package version
        run: |
          want="${GITHUB_REF_NAME#node-v}"
          have="$(node -p "require('./package.json').version")"
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME but package.json is $have"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --access public

  pypi:
    if: startsWith(github.ref_name, 'python-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write   # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag matches package version
        working-directory: python
        run: |
          want="${GITHUB_REF_NAME#python-v}"
          have="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME but pyproject.toml is $have"; exit 1; }
      - name: Test
        working-directory: python
        run: pip install -e '.[test]' && pytest -q
      - name: Build
        working-directory: python
        run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
